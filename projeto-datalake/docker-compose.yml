services:
  postgres:
    image: postgres:15
    container_name: fasttrack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: fasttrack_pipeline
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../data:/app/data
      - ../data-lake:/app/data-lake
    env_file:
      - .env
    environment:
      JAVA_HOME: /usr/lib/jvm/temurin-11-jre-amd64
      PATH: /usr/lib/jvm/temurin-11-jre-amd64/bin:$PATH
    command: ["bash", "/app/run_pipeline.sh"]

volumes:
  postgres_data: